<ion-header><ion-toolbar color="primary"><ion-title>Detalhes do Orçamento</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding"><ion-list>
  <ion-item><ion-label>Valor da diária</ion-label><ion-note slot="end">R$ {{ diaria | number:'1.2-2' }}</ion-note></ion-item>
  <ion-item><ion-label>Dias de hospedagem</ion-label><ion-note slot="end">{{ dias }}</ion-note></ion-item>
  <ion-item color="light"><ion-label><strong>Total a pagar</strong></ion-label><ion-note slot="end"><strong>R$ {{ total | number:'1.2-2' }}</strong></ion-note></ion-item>
</ion-list><ion-button expand="block" fill="outline" routerLink="/">VOLTAR</ion-button><ion-button expand="block" (click)="confirmar()">CONFIRMAR</ion-button></ion-content>
